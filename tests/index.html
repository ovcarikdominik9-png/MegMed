<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegMed – testy</title>
  <style>
    body { font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #14060f; color: #fff1f8; padding: 24px; max-width: 900px; margin: auto; }
    h1 { font-size: 26px; }
    li { margin: 6px 0; list-style: none; }
    .ok::before { content: "✓ "; color: #3ee08f; font-weight: 700; }
    .fail::before { content: "✗ "; color: #ff5c74; font-weight: 700; }
    pre { color: #ffb0c8; white-space: pre-wrap; margin: 4px 0 0 20px; }
    #summary { font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Testy pravidla „Dnes“</h1>
  <p id="summary">Spúšťam…</p>
  <ul id="out"></ul>
  <script type="module">
    import { tests } from './plan.test.js';
    const out = document.getElementById('out');
    let pass = 0;
    for (const t of tests) {
      const li = document.createElement('li');
      try { await t.fn(); li.className = 'ok'; li.textContent = t.name; pass++; }
      catch (e) { li.className = 'fail'; li.textContent = t.name; const pre = document.createElement('pre'); pre.textContent = e.message; li.append(pre); }
      out.append(li);
    }
    const s = document.getElementById('summary');
    s.textContent = `${pass} / ${tests.length} testov prešlo`;
    s.style.color = pass === tests.length ? '#3ee08f' : '#ff5c74';
    window.testResult = { pass, total: tests.length };
  </script>
</body>
</html>
